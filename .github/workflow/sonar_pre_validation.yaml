### sonar_pre_validation.py

```python id="q0v36z"
import os
import sys
import subprocess
import xml.etree.ElementTree as ET

ALLOWED_JAVA_VERSIONS = ["1.8", "17"]

EXCLUDED_DIRS = [
    "node_modules",
    "target",
    ".m2",
    "reports"
]


def print_header(title):
    print("\n" + "=" * 60)
    print(title)
    print("=" * 60)


def validate_java():

    print_header("JAVA VALIDATION")

    try:
        output = subprocess.check_output(
            ["java", "-version"],
            stderr=subprocess.STDOUT,
            text=True
        )

        print(output)

        if "1.8" in output:
            version = "1.8"

        elif "17" in output:
            version = "17"

        else:
            version = "Unsupported"

        print(f"[INFO] Detected Java Version : {version}")

        if version not in ALLOWED_JAVA_VERSIONS:
            raise Exception(
                f"Only Java {ALLOWED_JAVA_VERSIONS} supported"
            )

    except Exception as e:
        print(f"[ERROR] Java validation failed : {e}")
        sys.exit(1)


def validate_maven():

    print_header("MAVEN VALIDATION")

    try:
        output = subprocess.check_output(
            ["mvn", "-v"],
            text=True
        )

        print(output)
        print("[INFO] Maven Installed")

    except Exception as e:
        print(f"[ERROR] Maven validation failed : {e}")
        sys.exit(1)


def validate_pom():

    print_header("POM VALIDATION")

    pom_file = "pom.xml"

    if not os.path.exists(pom_file):
        print("[ERROR] pom.xml not found")
        sys.exit(1)

    print("[INFO] pom.xml exists")

    try:

        tree = ET.parse(pom_file)
        root = tree.getroot()

        ns = {'m': 'http://maven.apache.org/POM/4.0.0'}

        packaging = root.find('m:packaging', ns)

        if packaging is not None:

            if packaging.text == "pom":
                print("[INFO] Multi-module Maven project detected")

            else:
                print("[INFO] Single module Maven project")

        parent = root.find('m:parent', ns)

        if parent is not None:
            print("[INFO] Parent POM configuration found")

    except Exception as e:
        print(f"[ERROR] Failed parsing pom.xml : {e}")
        sys.exit(1)


def validate_sonar_properties():

    print_header("SONAR PROPERTY VALIDATION")

    sonar_file = "sonar-project.properties"

    if os.path.exists(sonar_file):
        print("[INFO] sonar-project.properties found")

    else:
        print("[WARNING] sonar-project.properties not found")


def validate_exclusions():

    print_header("SONAR EXCLUSION VALIDATION")

    for folder in EXCLUDED_DIRS:

        if os.path.exists(folder):
            print(f"[INFO] Exclusion applicable : {folder}")

        else:
            print(f"[INFO] Folder not present : {folder}")


def validate_pipeline_inputs():

    print_header("PIPELINE INPUT VALIDATION")

    app_name = os.getenv("APP_NAME")

    if not app_name:
        print("[ERROR] APP_NAME environment variable missing")
        sys.exit(1)

    print(f"[INFO] Application Name : {app_name}")


def main():

    print_header("SONARQUBE PRE VALIDATION STARTED")

    validate_pipeline_inputs()

    validate_java()

    validate_maven()

    validate_pom()

    validate_sonar_properties()

    validate_exclusions()

    print("\n[SUCCESS] All validations passed successfully")
    sys.exit(0)


if __name__ == "__main__":
    main()
```

