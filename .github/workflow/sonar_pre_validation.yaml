### .github/workflows/sonar-enterprise.yml

```yaml id="3ltb7w"
name: Enterprise SonarQube Pipeline

on:
  workflow_dispatch:
    inputs:
      application_name:
        description: "Application Name"
        required: true

env:
  SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
  SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
  APP_NAME: ${{ github.event.inputs.application_name }}

jobs:

  # =====================================================
  # PRE VALIDATION
  # =====================================================

  pre-validation:

    runs-on: self-hosted

    steps:

      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify Java
        run: java -version

      - name: Verify Maven
        run: mvn -v

      - name: Execute Sonar Pre Validation Script
        run: |
          python sonar_pre_validation.py

  # =====================================================
  # BUILD
  # =====================================================

  build:

    runs-on: self-hosted

    needs: pre-validation

    steps:

      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Maven Build
        run: |
          mvn clean install -DskipTests

  # =====================================================
  # DEPENDENCY SCAN
  # =====================================================

  dependency-scan:

    runs-on: self-hosted

    needs: build

    steps:

      - name: Checkout Source
        uses: actions/checkout@v4

      - name: OWASP Dependency Check
        run: |
          mvn org.owasp:dependency-check-maven:check

  # =====================================================
  # SONAR SCAN
  # =====================================================

  sonar-scan:

    runs-on: self-hosted

    needs:
      - dependency-scan

    steps:

      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Execute SonarQube Scan
        run: |

          mvn sonar:sonar \
          -Dsonar.projectKey=$APP_NAME \
          -Dsonar.host.url=$SONAR_HOST_URL \
          -Dsonar.login=$SONAR_TOKEN \
          -Dsonar.exclusions=**/node_modules/**,**/target/**,**/.m2/**,**/reports/**

  # =====================================================
  # QUALITY GATE
  # =====================================================

  quality-gate:

    runs-on: self-hosted

    needs: sonar-scan

    steps:

      - name: SonarQube Quality Gate Check
        uses: sonarsource/sonarqube-quality-gate-action@master
        timeout-minutes: 10
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # =====================================================
  # REPORT GENERATION
  # =====================================================

  generate-report:

    runs-on: self-hosted

    needs: quality-gate

    steps:

      - name: Create Sonar Report
        run: |

          mkdir -p reports

          echo "Application Name : $APP_NAME" > reports/sonar-report.txt
          echo "Pipeline Status  : SUCCESS" >> reports/sonar-report.txt
          echo "Generated Time   : $(date)" >> reports/sonar-report.txt

      - name: Upload Report
        uses: actions/upload-artifact@v4
        with:
          name: sonar-report
          path: reports/

  # =====================================================
  # DATABASE UPDATE
  # =====================================================

  db-update:

    runs-on: self-hosted

    needs: generate-report

    steps:

      - name: Update Database
        run: |

          echo "Inserting Sonar Metrics into Database"

          echo "Rule Codes Inserted"
          echo "Severity Counts Inserted"
          echo "Lifecycle Details Inserted"
          echo "Application Details Inserted"

      - name: Pipeline Completion
        run: |
          echo "Enterprise SonarQube Pipeline Completed Successfully"
